# Dependabot version updates (first-party; replaces Renovate where present).
# hironow house style (firepact/tablecodec/dotfiles): 7-day cooldown for
# supply-chain hardening (security updates bypass it), and each ecosystem
# grouped into a single PR so a week's bumps land together.
version: 2

# One Dependabot pull request per week for the whole repo (owner ruling
# 2026-09-14): every ecosystem below joins the `weekly` group, whose schedule is
# this repo's slot on a weeknight JST (hub `just dependabot-slot <repo>`) — one CI
# run on the runner pool per repo per week instead of one per ecosystem, and no
# org-wide Monday burst. The per-ecosystem cooldown and labels are unchanged;
# commit-message and open-pull-requests-limit live on the group (Dependabot
# refuses them on the entries).
multi-ecosystem-groups:
  weekly:
    schedule:
      interval: "weekly"
      day: "friday"
      time: "17:35"
      timezone: "Etc/UTC"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

updates:

  - package-ecosystem: "gomod"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    cooldown:
      default-days: 7
    labels: ["dependencies", "gomod"]
  - package-ecosystem: "github-actions"
    patterns: ["*"]
    multi-ecosystem-group: "weekly"
    directory: "/"
    cooldown:
      default-days: 7
    labels: ["dependencies", "github-actions"]
